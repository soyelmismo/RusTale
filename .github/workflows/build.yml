name: Build & Auto-Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ---------------------------------------------------
  # 1. JOB DE COMPILACIÓN WINDOWS
  # ---------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc

    - name: Build Release
      run: cargo build --release --verbose

    # Renombramos para que el updater lo detecte fácilmente
    - name: Rename Binary
      run: |
        cd target/release
        mv rustale.exe RusTale-windows.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-windows
        path: target/release/RusTale-windows.exe

  # ---------------------------------------------------
  # 2. JOB DE COMPILACIÓN LINUX
  # ---------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libfreetype6-dev libexpat1-dev libxcb-composite0-dev libasound2-dev libglib2.0-dev libgtk-3-dev libxdo-dev

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Release
      run: cargo build --release --verbose

    # Renombramos el binario sin extensión
    - name: Rename Binary
      run: |
        cd target/release
        mv rustale RusTale-linux

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-linux
        path: target/release/RusTale-linux

  # ---------------------------------------------------
  # 3. JOB DE RELEASE Y CHANGELOG
  # ---------------------------------------------------
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Necesario para leer el historial de git

    - name: Download Windows Binary
      uses: actions/download-artifact@v4
      with:
        name: binary-windows
        path: release_assets

    - name: Download Linux Binary
      uses: actions/download-artifact@v4
      with:
        name: binary-linux
        path: release_assets

    # GENERACIÓN DE CHANGELOG
    - name: Generate Changelog
      id: changelog
      run: |
        # Busca el último tag. Si no existe, usa el hash inicial.
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        echo "Generating changelog since: $LAST_TAG"
        
        if [ -z "$LAST_TAG" ]; then
          # Si es el primer release, toma los últimos 20 commits
          CHANGES=$(git log --pretty=format:"- %s (%h)" -n 20)
        else
          # Si hay tag previo, toma los cambios desde ese tag hasta HEAD
          CHANGES=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)")
        fi
        
        # Guardar en output multilinea para el siguiente paso
        echo "changes<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # GENERACIÓN DE VERSIÓN (Fecha + Hash Corto)
    - name: Generate Version Tag
      id: tagger
      run: |
        DATE=$(date +'%Y.%m.%d')
        SHA=$(git rev-parse --short HEAD)
        TAG="v$DATE-$SHA"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tagger.outputs.tag }}
        name: Build ${{ steps.tagger.outputs.tag }}
        body: |
          ## 🚀 New Update
          
          **Changelog:**
          ${{ steps.changelog.outputs.changes }}
          
          ---
          *Auto-generated by RusTale CI*
        files: |
          release_assets/RusTale-windows.exe
          release_assets/RusTale-linux
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: false
        make_latest: true