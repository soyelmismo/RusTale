[package]
name = "auth_server"
version = "0.0.1"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8.8", features = ["json", "macros", "ws"] }

# Async runtime
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "fs", "net"] }

# Internal dependencies
rustale_shared = { path = "../crates/rustale_shared" }
rustale_security = { path = "../crates/rustale_security" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4.43", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
anyhow = "1.0.102"
bytes = "1.11.1"

# Crypto
sha2 = "0.10.9"
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.9.2"

# Archive handling (for cosmetics)
zip = { version = "7.2.0", features = ["deflate"] }

[lib]
name = "auth_server"
path = "src/lib.rs"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util", "rt", "macros"] }
tempfile = "3.25"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8"] }
futures = "0.3"
