[package]
name = "rustale"
version = "0.0.1"
edition = "2024"
default-run = "rustale"

# Feature flags allow swapping the frontend without forking the launcher.
# Usage:
#   cargo build                    → builds with GUI (default)
#   cargo build --no-default-features --features tui  → future TUI frontend
#   cargo build --no-default-features                 → headless / server-only
[features]
default = ["gui"]
gui     = ["dep:rustale_iced", "dep:rfd"]
# tui   = ["dep:rustale-tui"]  # future: uncomment when rustale-tui is created

[build-dependencies]
winres = "0.1.12"
sha2 = "0.10.9"

[dependencies]
# Frontend crates — only the selected frontend is compiled in
rustale_iced   = { path = "../crates/rustale_iced",  optional = true }
# rustale-tui  = { path = "../crates/rustale-tui",   optional = true }  # future

rustale_shared = { path = "../crates/rustale_shared" }
rustale_engine = { path = "../crates/rustale_engine" }
rustale_server = { path = "../crates/rustale_server" }
rustale_security = { path = "../../rustale_security" }
auth_server = { path = "../auth_server" }
mimalloc = { version = "0.1.48", default-features = false }

tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process", "signal"] }
async-trait = "0.1.89"

reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls", "http2"] }
futures = "0.3.32"
futures-util = "0.3.32"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.0.3"

directories = "6.0.0"
open = "5.3.3"
sysinfo = "0.38.2"
uuid = { version = "1.21.0", features = ["v4", "v5", "fast-rng", "serde"] }
sha2 = "0.10.9"
ctrlc = { version = "3.5.2", features = ["termination"] }

hex = "0.4.3"
chrono = { version = "0.4.43", features = ["serde"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
base64 = "0.22.1"
rand = "0.9.2"
axum = { version = "0.8.8", features = ["json", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
regex = "1.12.3"

zip = { version = "7.2.0", features = ["aes-crypto", "deflate"] }
flate2 = "1.1.9"
tar = "0.4.44"

rust-embed = "8.11.0"
clap = { version = "4.5.60", features = ["derive"] }

image = "0.25.9"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
bytes = "1.11.1"
urlencoding = "2.1.3"
single-instance = "0.3.3"
bytemuck = { version = "1.25.0", features = ["derive"] }
dotenv = "0.15.0"
once_cell = "1.21.3"

# GUI-only dependencies (not needed for dedicated server mode)
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
] }
