[package]
name = "rustale"
version = "0.0.1"
edition = "2024"
default-run = "rustale"

[build-dependencies]
# Usamos std::process::Command para llamar a cargo, no se requieren dependencias externas extras por ahora
winres = "0.1.12"

# Optimization for Release: This makes the binary MUCH smaller and faster

[dependencies]
# UI Framework - Características necesarias para el proyecto
iced = { version = "0.14.0", features = [
    "image",
    "svg",
    "tokio",
    "advanced",
    "canvas",
    "wgpu",
] }

iced_renderer = "0.14.0"

mimalloc = { version = "0.1.48", default-features = false }

# Async Runtime - Características específicas necesarias para el proyecto
tokio = { version = "1.49.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "net",
    "process",  # Necesario para tokio::process::Command
    "signal"    # Necesario para tokio::signal::ctrl_c
] }
async-trait = "0.1.89"

# HTTP Client
reqwest = { version = "0.13.1", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "http2",
] }
futures = "0.3.31"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"

# System interaction
directories = "6.0.0"
open = "5.3.3"
uuid = { version = "1.19.0", features = ["v4", "v5", "fast-rng", "serde"] }
sha2 = "0.10.9"
ctrlc = { version = "3.5.1", features = ["termination"] }

# Utilities
hex = "0.4.3"
# Added 'serde' feature to chrono
chrono = { version = "0.4.43", features = ["serde"] }
anyhow = "1.0.100"
# Removed: thiserror (unused)
# thiserror = "2.0.18"
base64 = "0.22.1"
rand = "0.9.2"
# Removed: memchr (unused)
# memchr = "2.7.6"
warp = { version = "0.4.2", features = ["server"] }
# Removed: portpicker (unused)
# portpicker = "0.1.1"
regex = "1.12.2"


# Archive extraction
zip = { version = "7.2.0", features = ["aes-crypto", "deflate"] }
flate2 = "1.1.8"
tar = "0.4.44"

# Native file dialogs
rfd = { version = "0.17.2", default-features = false, features = [
    "xdg-portal",
] }

rust-embed = "8.11.0"

# Command line arguments
clap = { version = "4.5.54", features = ["derive"] }

# System Tray
tray-icon = "0.21.3"
# Removed: tao (unused)
# tao = { version = "0.34.5", default-features = false, features = [
#     "rwh_06",
#     "x11",
# ] }
# To load icons in the tray
image = "0.25.9"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }

# Removed: memmap2 (unused)
# memmap2 = "0.9.9"

# Removed: rayon (unused)
# rayon = "1.11.0"

# Removed: md5 (unused)
# md5 = "0.8.0"
bytes = "1.11.0"

urlencoding = "2.1.3"

single-instance = "0.3.3"

bytemuck = { version = "1.24.0", features = ["derive"] }

# Environment variables
dotenv = "0.15.0"

# Performance optimization
once_cell = "1.21.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus", # <--- CRÍTICO PARA LIMPIAR RAM
] }

# Removed: tokio-stream (unused)
# tokio-stream = { version = "0.1.18", features = ["net"] }
