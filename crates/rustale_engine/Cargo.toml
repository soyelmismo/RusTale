[package]
name = "rustale_engine"
version = "0.0.1"
edition = "2024"

[features]
default = ["full", "tray", "security"]
full = ["modding", "patching", "news", "auth"]
tray = ["dep:tray-icon", "dep:rustale_tray"]
modding = ["dep:zip", "dep:serde_json"]
patching = ["dep:sha2", "dep:ed25519-dalek"]
news = []
auth = ["dep:auth_server"]
headless = []
security = ["dep:rustale_security"]

[dependencies]
rustale_shared = { path = "../rustale_shared" }
rustale_security = { path = "../../../rustale_security", optional = true }
auth_server = { path = "../../auth_server", optional = true }
tokio = { version = "1.49.0", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread", "process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
toml = "1.0.3"
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
directories = "6.0"
uuid = { version = "1.21", features = ["v4", "serde"] }

tray-icon = { version = "0.21.3", optional = true }
rustale_tray = { path = "../rustale_tray", optional = true }
image = "0.25.9"
ctrlc = { version = "3.5.2", features = ["termination"] }
rand = "0.9.2"
open = "5.3.3"
hex = "0.4.3"
dotenv = "0.15.0"
async-trait = "0.1"
urlencoding = "2.1"
sysinfo = "0.30"

# Optional features
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
# zip defined in launcher: zip = "7.2.0". It's probably `zip-rs` (crate name `zip`).
# engine used `zip 0.6`. That is VERY old or different crate?
# I will use "zip = 0.6" as it was in engine, to avoid breaking logic I moved.
# wait, version 0.1? No, 0.6 was in engine. Launcher has 7.2.0? That sounds like specific fork or maybe I misread?
# zip crate current version is 2.x?
# check launcher Cargo.toml: `zip = { version = "7.2.0", features = ["aes-crypto", "deflate"] }`
# zip 7.x? Only `zip` crate 2.2.0 exists in crates.io?
# Maybe `zip` crate 0.6 is old `zip`.
# Launcher `zip 7.2.0` ... that's suspicious. Maybe it's `sevenz-rust` or something?
# Ah, I'll copy what WAS in engine Cargo.toml: zip = 0.6.
# If I moved code from launcher, and launcher used 7.2.0, then engine logic (from launcher) might expect 7.2.0!
# But `launcher/src/game/` uses zip to extract mods?
# I should probably update engine to use what launcher used if I moved logic from launcher.
# Launcher used: zip = "7.2.0". I will use that.

sha2 = { version = "0.10", optional = true }
ed25519-dalek = { version = "2.2", optional = true }
futures = "0.3"
base64 = "0.22"
once_cell = "1.21"
libc = "0.2.180"
regex = "1.12"
flate2 = "1.1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1.49", features = ["test-util", "rt", "macros"] }
tempfile = "3.25"
pretty_assertions = "1.4"
wiremock = "0.6"
base64 = "0.22"
once_cell = "1.21"
libc = "0.2.180"
regex = "1.12"
flate2 = "1.1"
tar = "0.4"
