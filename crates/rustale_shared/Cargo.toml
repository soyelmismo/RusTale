[package]
name = "rustale_shared"
version = "0.0.1"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.21", features = ["v4", "serde"] }
toml = "1.0.3"
thiserror = "1.0"
strum = "0.26"
strum_macros = "0.26"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.102"
directories = "5.0"
rand = "0.9.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
tokio = { version = "1.49", features = ["fs", "io-util", "rt-multi-thread", "process", "time", "sync"] }
rust-embed = "8.11"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream", "multipart", "http2", "form"] }
futures = "0.3"
once_cell = "1.21"
hex = "0.4.3"
sha2 = "0.10"
ed25519-dalek = "2.2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
async-trait = "0.1.89"
zeroize = { version = "1.8", features = ["derive"] }
aes-gcm = "0.10"
generic-array = "0.14"
rustale_security = { path = "../rustale_security", optional = true }
rustls = { version = "0.23.36", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[dev-dependencies]
tokio = { version = "1.49", features = ["test-util", "rt", "macros"] }
tempfile = "3.25"
pretty_assertions = "1.4"
proptest = "1.10"

[features]
default = ["security"]
security = ["dep:rustale_security"]

# Note: Added reqwest/futures to centralize downloader and client singleton.
