[package]
name = "aurora"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"] # Genera .dll en Windows y .so en Linux

[dependencies]
# Para manipulación de memoria segura/insegura y headers del sistema
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading"
] }

[target.'cfg(unix)'.dependencies]
ctor = "0.6.3" # Para ejecutar código al cargar la librería (como __attribute__((constructor)))
