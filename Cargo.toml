[workspace]
members = ["launcher", "aurora"]
resolver = "2"

[profile.release]
opt-level = 3       # Máxima optimización (hace el flujo de control complejo)
lto = "thin"          # Link Time Optimization (mezcla código entre crates, dificil de separar)
codegen-units = 4  # Reduce paralelismo para mejorar la optimización LTO
panic = 'abort'     # Elimina la lógica de "unwinding" (reduce tamaño y pistas de flujo)
strip = true        # ELIMINA LOS SIMBOLOS (hace que las funciones se llamen sub_401000)
debug = false       # Asegura que no haya info de debug

[profile.unopt]
inherits = "release" # Hereda defaults de release para no olvidar detalles
opt-level = 0        # Sin optimización (Compila rápido, corre lento)
lto = "off"          # Apaga LTO explicitamente (Linkeo rápido)
codegen-units = 256  # CLAVE: Paraleliza la compilación al máximo
panic = 'abort'      # Sin unwinding (menor tamaño, linkeo más simple)
strip = false        # Saltar el paso de stripping ahorra tiempo de build
debug = false        # Sin info de debug
incremental = true   # Opcional: Habilita compilación incremental (cache)